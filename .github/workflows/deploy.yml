name: Deploy

on:
  push:
    branches: [main]

permissions:
  contents: read
  deployments: write

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
      url: https://refactorplug.com
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci
        env:
          HUSKY: 0

      - name: Build (static export)
        run: npm run build
        env:
          # Switches the AnalyticsProvider from NoOp to BeaconAnalyticsTracker
          # so custom user-action events POST to /api/track in production.
          # Pageviews + Core Web Vitals are handled by Cloudflare's
          # auto-injected Web Analytics beacon — no token needed in our
          # bundle.
          NEXT_PUBLIC_ANALYTICS_ENABLED: "true"

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy out --project-name=ritl --branch=main
